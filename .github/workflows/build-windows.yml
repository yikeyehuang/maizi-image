name: 打包 Windows exe

on:
  workflow_dispatch:          # 在 Actions 页面手动点一下就跑
  push:
    branches: [main]
    tags: ['v*']              # 打 tag 时顺便发 Release，得到永久下载链接

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: 打包（文件夹版，比单文件更难被误报）
        run: >
          python -m PyInstaller --onedir --noconsole --clean
          --name 共济生图
          --icon app.ico
          --version-file version_info.txt
          --add-data "index.html;."
          app.py

      - name: 检查产物
        run: |
          python -c "import os; d='dist/共济生图'; f=sorted(os.listdir(d)); print('files:', f[:6]); print('exe MB: %.1f' % (os.path.getsize(d+'/共济生图.exe')/1048576)); print('total MB: %.1f' % (sum(os.path.getsize(os.path.join(r,x)) for r,_,fs in os.walk(d) for x in fs)/1048576))"

      - name: 上传产物（可在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: gongji-image-windows
          path: dist/共济生图/
          if-no-files-found: error
          retention-days: 90

      - name: 发布 Release（仅打 tag 时执行，得到永久下载链接）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path "dist/共济生图/*" -DestinationPath "dist/共济生图-windows.zip" -Force
          gh release create ${{ github.ref_name }} "dist/共济生图-windows.zip" --title "共济生图 ${{ github.ref_name }}" --generate-notes
