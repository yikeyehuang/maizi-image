<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>生图</title>
<style>
  * { box-sizing: border-box; }
  /* 有 display 声明的元素会盖掉 hidden 属性，统一兜底 */
  [hidden] { display: none !important; }
  :root {
    --line: #e8e8ee;
    --line-strong: #dcdce4;
    --ink: #16161d;
    --muted: #8a8a99;
    --muted-2: #a9a9b8;
    --primary: #5a57e8;
    --primary-soft: #eeedff;
    --bg: #f6f6f9;
    --danger: #c2410c;
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { display: flex; gap: 18px; padding: 18px; align-items: flex-start; min-height: 100%; }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  .form { width: 460px; flex: 0 0 460px; padding: 16px; }   /* 按钮到卡片底边 16px */
  .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  /* 分段控制器：img-2.5 标准版 / 增强版 */
  .seg { display: flex; gap: 4px; padding: 4px; background: #f1f1f5; border-radius: 10px; margin-bottom: 16px; }
  .seg button {
    flex: 1; height: 34px; border: 0; border-radius: 7px; background: transparent;
    font: inherit; font-size: 13px; color: #55556a; cursor: pointer; transition: background .15s, color .15s, box-shadow .15s;
  }
  .seg button:not(.active):hover { color: var(--primary); }
  .seg button.active { background: #fff; color: var(--primary); font-weight: 500; box-shadow: 0 1px 3px rgba(20,20,40,.12); }
  .label { font-size: 13px; color: #4b4b5a; font-weight: 500; }
  .label .opt { color: var(--muted-2); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .link { font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .link:hover { color: var(--primary); }

  textarea {
    width: 100%; height: 158px; resize: vertical; padding: 12px;
    border: 1px solid var(--line-strong); border-radius: 10px; outline: none;
    font: inherit; color: var(--ink); background: #fff;
  }
  textarea::placeholder { color: var(--muted-2); }
  textarea:focus { border-color: #b9b7f5; box-shadow: 0 0 0 3px var(--primary-soft); }
  .prompt-box { position: relative; margin-bottom: 16px; }   /* 与下方「参考图片」留 16px 间距 */
  .prompt-box textarea { display: block; padding-bottom: 30px; }   /* block 去掉 inline 基线空隙，定位基准才准 */
  /* 字数提示：贴在输入框右下角内部（避让右下角的拖拽手柄） */
  .counter {
    position: absolute; right: 15px; bottom: 8px; margin: 0;
    font-size: 12px; color: var(--muted-2); pointer-events: none; user-select: none;
  }
  .counter.over { color: var(--danger); }

  /* 参考图：一行固定 5 个 */
  .refs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  .drop {
    width: 100%; aspect-ratio: 1 / 1; border: 1px dashed var(--line-strong); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--muted); cursor: pointer; background: #fcfcfe; text-align: center;
    font-size: 10.5px; line-height: 1.3; padding: 4px; transition: border-color .15s, background .15s, color .15s;
  }
  .drop:hover { border-color: #b9b7f5; color: var(--primary); background: var(--primary-soft); }
  /* 拖拽悬停态 */
  .drop.over { border-style: solid; border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
  .drop .plus { font-size: 18px; font-weight: 300; line-height: 1; }
  .thumb { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .x {
    position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(20,20,28,.68); color: #fff; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer;
  }
  .thumb .x:hover { background: #d33; }
  /* 上传中：遮暗 + 进度条 */
  .thumb.pending img { filter: brightness(.75); }
  .thumb.err { border-color: #f0b4ae; background: #fff5f4; }
  .thumb .pct {
    position: absolute; left: 0; right: 0; bottom: 11px; text-align: center;
    font-size: 10px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .thumb.err .pct { color: var(--danger); text-shadow: none; bottom: 50%; transform: translateY(50%); font-size: 11px; }
  .thumb .prog {
    position: absolute; left: 7px; right: 7px; bottom: 6px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.5); overflow: hidden;
  }
  .thumb .prog > i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .25s linear; }

  /* 双栏严格 50%：minmax(0,1fr) 防止下拉框内容把栅格撑歪 */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .field { position: relative; min-width: 0; }
  .field > .label { display: block; margin-bottom: 6px; font-size: 12.5px; }
  .field.wide { grid-column: 1 / -1; }
  .control { position: relative; min-width: 0; }

  select, .num {
    width: 100%; max-width: 100%; min-width: 0; height: 38px; padding: 0 30px 0 11px;
    border: 1px solid var(--line-strong); border-radius: 9px; background: #fff;
    font: inherit; color: var(--ink); outline: none; appearance: none; cursor: pointer;
    text-overflow: ellipsis;
  }
  select:focus { border-color: #b9b7f5; box-shadow: 0 0 0 3px var(--primary-soft); }
  /* 禁用的下拉（如标准版只有 1K）：明确置灰 */
  select:disabled { background: #f2f2f6; border-color: var(--line); color: var(--muted-2); cursor: not-allowed; box-shadow: none; }
  .field.unsupported .control::after { border-color: #d5d5dd; }
  .control::after {
    content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -4px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); pointer-events: none;
  }

  .ratio-glyph { display: inline-block; vertical-align: -2px; margin-right: 8px; border: 1.5px solid currentColor; border-radius: 2px; }

  .stepper { display: flex; align-items: center; height: 38px; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
  .stepper button { width: 38px; height: 100%; border: 0; background: #fff; color: #55556a; font-size: 17px; cursor: pointer; }
  .stepper button:hover:not(:disabled) { background: #f4f4f8; color: var(--primary); }
  .stepper button:disabled { color: #d5d5dd; cursor: not-allowed; }
  .stepper input {
    flex: 1; height: 100%; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    text-align: center; font: inherit; outline: none; min-width: 0;
  }

  .submit {
    width: 100%; height: 46px; margin-top: 16px; border: 0; border-radius: 11px;
    background: var(--primary); color: #fff; font: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: background .18s ease, box-shadow .18s ease, transform .12s ease, color .18s ease;
  }
  .submit:not(:disabled):hover { background: #4d4ad8; transform: translateY(-1px); box-shadow: 0 7px 18px rgba(90,87,232,.3); }
  .submit:not(:disabled):active { transform: translateY(0) scale(.994); box-shadow: 0 2px 6px rgba(90,87,232,.24); }
  .submit:not(:disabled):focus-visible { outline: 3px solid var(--primary-soft); outline-offset: 2px; }
  /* 没写提示词 → 置灰不可点 */
  .submit:disabled { background: #cbccd6; color: #fbfbfd; cursor: not-allowed; box-shadow: none; transform: none; }
  /* 生成中：保持品牌色但不可点 */
  .submit.busy:disabled { background: #b9b7f0; cursor: progress; }
  .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 记录面板：列表区固定保留「两行卡片」的高度，空状态与分页器始终在位 */
  .stage { flex: 1; min-width: 0; padding: 16px; display: flex; flex-direction: column; }
  .stage-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex: 0 0 auto; }
  .stage-head h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .stage-head .count { font-size: 12px; font-weight: 400; color: var(--muted-2); margin-left: 6px; }
  .status { font-size: 12px; color: var(--muted); }
  .status.err { color: var(--danger); }

  /* 列表区最小高度 = 两行卡片（240 × 2 + 行距 14）；卡片多了自然往下长 */
  .list { position: relative; min-height: 494px; flex: 0 0 auto; }
  .results {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px;
    align-content: start; padding-right: 6px;
  }
  .results::-webkit-scrollbar { width: 8px; }
  .results::-webkit-scrollbar-thumb { background: #dcdce4; border-radius: 4px; }
  .results::-webkit-scrollbar-thumb:hover { background: #c6c6d2; }

  /* 卡片固定尺寸：缩略图按截图方式裁切填充，不随原图比例变化 */
  .card { height: 240px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .card .shot { position: relative; flex: 0 0 172px; height: 172px; background: #f2f2f6; display: grid; place-items: center; overflow: hidden; }
  /* 绝对定位强制铺满 + cover 居中裁切：任何比例都得到同样大小的缩略图 */
  .card .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  /* 占满整个画面区，否则进度条会被文字宽度挤成一个小点 */
  .card .ph {
    width: 100%; height: 100%; padding: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: var(--muted-2); font-size: 11.5px; line-height: 1.6;
  }
  .card .ph.bad { color: var(--danger); }
  /* 生成中的进度条 */
  .card .pbar { width: 64px; height: 6px; margin: 12px auto 0; border-radius: 3px; background: #e4e4ee; overflow: hidden; }
  .card .pbar > i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--primary); transition: width .5s ease; }
  .card .pbar.indet > i { width: 84%; animation: pslide 1.15s ease-in-out infinite; }   /* 没拿到百分比时来回滑 */
  @keyframes pslide { 0% { margin-left: -84%; } 100% { margin-left: 100%; } }
  .card .ppct { margin-top: 7px; font-size: 11px; color: var(--muted-2); }
  .card .body { flex: 1 1 auto; min-height: 0; padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; }
  .card .cap {
    position: relative; padding-right: 30px;
    font-size: 12px; color: #4b4b5a; line-height: 1.45; min-height: 2.9em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* 复制提示词 */
  .card .copy {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center; color: var(--muted-2); background: transparent; cursor: pointer;
    transition: color .15s, background .15s;
  }
  .card .copy:hover { color: var(--primary); background: var(--primary-soft); }
  .card .copy.done { color: #16a34a; background: transparent; }
  .card .copy svg { width: 16px; height: 16px; display: block; }
  .card .meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .card .meta .left { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta .right { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
  .card .meta a { color: var(--primary); text-decoration: none; cursor: pointer; }
  .card .meta a:hover { text-decoration: underline; }
  .card .idx { font-size: 10px; color: var(--muted); background: #f1f1f5; border-radius: 4px; padding: 1px 4px; }

  /* ── 授权闸门（桌面版：首次配置 / 每次启动校验）── */
  .gate {
    position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
    background: var(--bg); padding: 20px;
  }
  .gate-card {
    width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 26px 24px 22px; box-shadow: 0 18px 50px rgba(20,20,40,.08);
  }
  .gate-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .gate-mark {
    width: 32px; height: 32px; border-radius: 9px; background: var(--primary); color: #fff;
    display: grid; place-items: center; font-size: 15px; font-weight: 600;
  }
  .gate-title { font-size: 16px; font-weight: 600; }
  .gate-sub { margin: 0 0 18px; font-size: 12.5px; color: var(--muted); line-height: 1.65; }
  .gate-label { display: block; font-size: 12.5px; color: #4b4b5a; margin-bottom: 7px; }
  .gate-input {
    width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px;
    font: inherit; font-size: 13px; outline: none;
  }
  .gate-input:focus { border-color: #b9b7f5; box-shadow: 0 0 0 3px var(--primary-soft); }
  .gate-err {
    margin-top: 10px; padding: 8px 11px; border-radius: 9px; font-size: 12px; line-height: 1.6;
    background: #fdeceb; border: 1px solid #f6cfcb; color: #9b2c21;
  }
  .gate-warn {
    margin-top: 10px; padding: 8px 11px; border-radius: 9px; font-size: 12px; line-height: 1.6;
    background: #fff8ec; border: 1px solid #f5e3c2; color: #7a5a1e;
  }
  .gate-btn {
    width: 100%; height: 44px; margin-top: 16px; border: 0; border-radius: 11px; background: var(--primary);
    color: #fff; font: inherit; font-size: 14.5px; cursor: pointer; transition: background .18s;
  }
  .gate-btn:hover:not(:disabled) { background: #4d4ad8; }
  .gate-btn:disabled { background: #b9b7f0; cursor: progress; }
  .gate-btn.ghost { background: #f1f1f6; color: #4b4b5a; margin-top: 10px; height: 40px; font-size: 13px; }
  .gate-btn.ghost:hover { background: #e8e8f0; }
  .gate-hint { margin-top: 14px; font-size: 11.5px; color: var(--muted-2); line-height: 1.7; text-align: center; }
  .gate-hint a { color: var(--primary); text-decoration: none; }
  .gate-spin {
    width: 26px; height: 26px; margin: 6px auto 14px; border: 2.5px solid #e6e6f2; border-top-color: var(--primary);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  .gate-center { text-align: center; }

  /* 桌面版才显示的头部按钮 */
  .stage-actions { display: flex; align-items: center; gap: 12px; }
  .stage-actions button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 2px 4px;
  }
  .stage-actions button:hover { color: var(--primary); }

  /* 图片全屏预览 */
  .lightbox {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 8, 12, .94);
  }
  .lb-img {
    max-width: 86vw; max-height: 80vh; border-radius: 6px; box-shadow: 0 24px 70px rgba(0,0,0,.55);
    background: #16161d; transform-origin: center center; cursor: zoom-in; position: relative; z-index: 1;
    user-select: none; -webkit-user-drag: none;
  }
  .lb-img.zoomed { cursor: grab; }
  .lb-img.dragging { cursor: grabbing; }
  .lb-close { z-index: 2;
    position: absolute; top: 18px; right: 22px; width: 36px; height: 36px; border: 0; border-radius: 9px;
    background: rgba(255,255,255,.12); color: #fff; font-size: 17px; cursor: pointer;
  }
  .lb-close:hover { background: rgba(255,255,255,.22); }
  .lb-count { z-index: 2;
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.85); font-size: 13px;
  }
  .lb-nav { z-index: 2;
    position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border: 0;
    border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .lb-nav svg { width: 22px; height: 22px; display: block; }
  .lb-nav:hover { background: rgba(255,255,255,.24); }
  .lb-nav.prev { left: 26px; }
  .lb-nav.next { right: 26px; }
  .lb-nav[disabled] { opacity: .22; cursor: default; }
  .lb-info { z-index: 2; position: absolute; left: 26px; bottom: 22px; max-width: min(54vw, 680px); color: #fff; }
  .lb-model { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: rgba(255,255,255,.62); margin-bottom: 7px; }
  .lb-prompt { font-size: 13px; line-height: 1.62; color: rgba(255,255,255,.94); max-height: 4.9em; overflow: hidden; }
  .lb-copy {
    margin-top: 11px; padding: 6px 13px; border: 1px solid rgba(255,255,255,.28); border-radius: 8px;
    background: rgba(255,255,255,.1); color: #fff; font: inherit; font-size: 12px; cursor: pointer;
  }
  .lb-copy:hover { background: rgba(255,255,255,.2); }
  .lb-dl { z-index: 2;
    position: absolute; right: 26px; bottom: 22px; padding: 7px 15px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.1);
    color: rgba(255,255,255,.92); font: inherit; font-size: 12.5px;
    text-decoration: none; cursor: pointer;
  }
  .lb-dl:hover { background: rgba(255,255,255,.22); }
  .card .shot img { cursor: zoom-in; }

  /* 分页器 */
  .pager {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    gap: 6px; padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--line);
  }
  .pager button {
    min-width: 30px; height: 30px; padding: 0 8px; border: 1px solid var(--line-strong); background: #fff;
    border-radius: 8px; font: inherit; font-size: 12.5px; color: #4b4b5a; cursor: pointer;
  }
  .pager button:hover:not(:disabled) { border-color: #b9b7f5; color: var(--primary); background: var(--primary-soft); }
  .pager button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .pager button:disabled { color: #cfcfda; cursor: not-allowed; }
  .pager .dots { color: var(--muted-2); font-size: 12px; padding: 0 2px; }
  .pager .info { font-size: 12px; color: var(--muted-2); margin-left: 4px; }
  .empty {
    position: absolute; inset: 0; display: grid; place-content: center;
    text-align: center; color: var(--muted-2); font-size: 13px; line-height: 1.7;
  }
  .empty .big { font-size: 34px; margin-bottom: 10px; opacity: .45; }
  .bar { height: 4px; border-radius: 3px; background: #eeeef4; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .4s ease; }
  @media (max-width: 900px) {
    .wrap { flex-direction: column; align-items: stretch; }
    .form { width: 100%; flex: 1 1 auto; }
    .stage { width: 100%; }
    .results { overflow: visible; padding-right: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 左：表单 -->
  <section class="panel form">
    <div class="seg" id="seg"></div>
    <div class="label-row">
      <span class="label">提示词</span>
      <span class="link" id="clear">清空</span>
    </div>
    <div class="prompt-box">
      <textarea id="prompt" maxlength="32000" placeholder="描述你想要生成的图片..."></textarea>
      <div class="counter" id="counter">0 / 32000</div>
    </div>

    <div class="label-row">
      <span class="label">参考图片<span class="opt">可选 · 最多 <span id="refMax">16</span> 张</span></span>
    </div>
    <div class="refs" id="refs">
      <div class="drop" id="drop">
        <span class="plus">＋</span>
        <span>上传/粘贴<br />拖动图片</span>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden />

    <div class="grid">
      <div class="field">
        <label class="label" for="size">比例</label>
        <div class="control"><select id="size"></select></div>
      </div>
      <div class="field">
        <label class="label" for="resolution">分辨率</label>
        <div class="control"><select id="resolution"></select></div>
      </div>
      <div class="field wide">
        <label class="label" for="n">数量</label>
        <div class="stepper">
          <button type="button" id="minus" aria-label="减少">−</button>
          <input id="n" type="number" value="1" min="1" />
          <button type="button" id="plus" aria-label="增加">＋</button>
        </div>
      </div>
    </div>

    <button class="submit" id="go"><span id="go-text">生成图片</span></button>
    <div class="bar" id="bar" hidden><i></i></div>
  </section>

  <!-- 右：结果 -->
  <section class="panel stage">
    <div class="stage-head">
      <h1>生成记录 <span class="count" id="count"></span></h1>
      <span class="stage-actions">
        <span class="status" id="status">就绪</span>
        <button id="btnKey" hidden>设置密钥</button>
        <button id="btnQuit" hidden>退出</button>
      </span>
    </div>
    <div class="list">
      <div class="results" id="results"></div>
      <div class="empty" id="empty">
        <div class="big">🖼</div>
        还没有生成记录<br />填好表单，点「生成图片」
      </div>
    </div>
    <div class="pager" id="pager"></div>

  <!-- 图片预览 -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" title="关闭 (Esc)">✕</button>
    <div class="lb-count" id="lbCount"></div>
    <button class="lb-nav prev" id="lbPrev" title="上一张 (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-6 7 6 7"/></svg></button>
    <img class="lb-img" id="lbImg" alt="" />
    <button class="lb-nav next" id="lbNext" title="下一张 (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l6 7-6 7"/></svg></button>
    <div class="lb-info">
      <div class="lb-model" id="lbModel"></div>
      <div class="lb-prompt" id="lbPrompt"></div>
      <button class="lb-copy" id="lbCopy">复制提示词</button>
    </div>
    <button class="lb-dl" id="lbReveal">查看文件</button>
  </div>
  </section>
</div>

<!-- 授权闸门：首次配置 / 每次启动校验 -->
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <div class="gate-logo"><span class="gate-mark">麦</span><span class="gate-title">麦子 AI 生图</span></div>
    <div id="gateBody"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

/* 比例：完全照截图列全，不做任何过滤 */
const RATIOS = ['auto','1:1','3:2','2:3','4:3','3:4','16:9','9:16','5:4','4:5','21:9','2:1','1:2','9:21','3:1','1:3'];
const RESOLUTIONS = ['1K','2K','4K'];
const FALLBACK_RATIOS = ['auto', '1:1', '3:2', '2:3', '4:3', '3:4', '16:9', '9:16', '5:4', '4:5', '21:9'];
const FALLBACK_MODELS = [
  {
    id: 'gpt-image-2.5', label: 'img-2.5（标准版）',
    pricing: { '1K': 0.0081 }, resolutions: ['1K'],
    aspect_ratios: [...FALLBACK_RATIOS, '2:1', '1:2', '9:21', '3:1', '1:3'],
    references: 9, outputs: 1,
  },
  {
    id: 'gpt-image-2.5-sunburst-t', label: 'img-2.5（增强版）',
    pricing: { '1K': 0.0196, '2K': 0.0229, '4K': 0.0263 },
    resolutions: ['1K', '2K', '4K'], aspect_ratios: FALLBACK_RATIOS,
    references: 16, outputs: 10,
  },
];

let busy = false, poller = null;
/** 接口状态：授权模型 + 各自规格；先给安全默认值，拿到 /api/state 后覆盖 */
let state = { models: FALLBACK_MODELS, default: FALLBACK_MODELS[0].id };
let models = FALLBACK_MODELS, currentId = FALLBACK_MODELS[0].id;
let items = [];                         // 参考图磁贴：{id, name, preview, status, percent, phase, url, note, error}

const currentModel = () => models.find((m) => m.id === currentId) || models[0];

/** 把 "16:9" 画成小方块，最长边 14px */
function glyph(ratio) {
  const el = document.createElement('i');
  el.className = 'ratio-glyph';
  if (ratio === 'auto') { el.style.width = '14px'; el.style.height = '10px'; return el; }
  const [w, h] = ratio.split(':').map(Number);
  const long = 14, short = Math.max(6, Math.round(14 * Math.min(w, h) / Math.max(w, h)));
  el.style.width = (w >= h ? long : short) + 'px';
  el.style.height = (h >= w ? long : short) + 'px';
  return el;
}

function option(value, text, glyphRatio) {
  const o = document.createElement('option');
  o.value = value;
  o.textContent = text;
  if (glyphRatio) { o.textContent = ''; o.appendChild(glyph(glyphRatio)); o.appendChild(document.createTextNode(text)); }
  return o;
}

/** 分段控制器：img-2.5 标准版 / 增强版 */
function buildSegments() {
  const el = $('seg');
  el.innerHTML = '';
  models.forEach((m) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = m.label || m.id;
    b.className = m.id === currentId ? 'active' : '';
    b.title = m.id;
    b.onclick = () => { if (m.id !== currentId) { currentId = m.id; syncModel(); } };
    el.appendChild(b);
  });
}

/** 切换模型后，所有字段按该模型的规格重建 */
function syncModel(keepChoice = false) {
  const m = currentModel();
  const prevSize = $('size').value, prevRes = $('resolution').value, prevN = +$('n').value || 1;
  buildSegments();

  const size = $('size');
  size.innerHTML = '';
  RATIOS.filter((r) => (m.aspect_ratios || []).includes(r))
    .forEach((r) => size.appendChild(option(r, r === 'auto' ? 'Auto' : r, r)));
  const ratios = m.aspect_ratios || ['auto'];
  size.value = keepChoice && ratios.includes(prevSize) ? prevSize
    : (ratios.includes('1:1') ? '1:1' : ratios[0]);

  const res = $('resolution');
  res.innerHTML = '';
  (m.resolutions || ['1K']).forEach((r) => res.appendChild(option(r, r)));
  const resolutions = m.resolutions || ['1K'];
  res.value = keepChoice && resolutions.includes(prevRes) ? prevRes : resolutions[0];
  res.disabled = resolutions.length <= 1;   // 标准版只有 1K
  res.closest('.field').classList.toggle('unsupported', res.disabled);

  $('n').max = m.outputs || 1;
  $('refMax').textContent = m.references || 9;
  setN(keepChoice ? prevN : 1);
  price();
  renderRefs();
}

function price() {
  const el = $('go-text');
  if (!el) return;                      // 生成中按钮里是 spinner，没有这个节点
  const p = (currentModel().pricing || {})[$('resolution').value];
  el.textContent = p ? `生成图片 $${p.toFixed(4)}` : '生成图片';
  syncButton();
}

/* 先用兜底规格把表单立刻画出来（接口慢也不空着），拿到 /api/state 后再校准 */
syncModel();

(async () => {
  try {
    const s = await (await fetch('/api/state')).json();
    if (!applyAuth(s)) { pollAuth(); return; }
    pollAuth();   // trusted 先放行的情况下，后台仍要继续校验      // 未放行：先过闸门
  } catch (e) { /* 接口不可用：按非桌面版处理，保持兜底渲染 */ }
})();

/* 提示词计数 + 按钮可用状态（空提示词 → 置灰） */
function syncButton() {
  const empty = $('prompt').value.trim() === '';
  $('go').disabled = busy || empty;
  $('go').classList.toggle('busy', busy);
  $('go').title = empty ? '请先填写提示词' : '';
}
$('prompt').addEventListener('input', () => {
  const len = [...$('prompt').value].length;
  $('counter').textContent = `${len} / 32000`;
  $('counter').classList.toggle('over', len > 32000);
  syncButton();
});
$('clear').onclick = () => { $('prompt').value = ''; $('prompt').dispatchEvent(new Event('input')); };

/* 数量（上限跟着当前模型走：标准版只有 1 张） */
function setN(v) {
  const max = currentModel().outputs || 1;
  v = Math.max(1, Math.min(max, v || 1));
  $('n').value = v;
  $('minus').disabled = v <= 1;
  $('plus').disabled = v >= max;
}
$('minus').onclick = () => setN(+$('n').value - 1);
$('plus').onclick = () => setN(+$('n').value + 1);
$('n').onchange = () => setN(+$('n').value);
$('resolution').onchange = price;

/* 参考图：点击 / 粘贴 / 拖拽（拖到上传入口有高亮反馈） */
$('drop').onclick = () => $('file').click();
$('file').onchange = (e) => upload([...e.target.files]);
document.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith('image/'));
  if (files.length) upload(files);
});

const dropZone = $('drop');
['dragenter', 'dragover'].forEach((ev) => dropZone.addEventListener(ev, (e) => {
  e.preventDefault(); e.stopPropagation();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
  dropZone.classList.add('over');
}));
dropZone.addEventListener('dragleave', (e) => {
  if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('over');
});
dropZone.addEventListener('drop', (e) => {
  e.preventDefault(); e.stopPropagation();
  dropZone.classList.remove('over');
  const files = [...(e.dataTransfer?.files || [])].filter((f) => f.type.startsWith('image/'));
  if (files.length) upload(files);
  else setStatus('拖进来的不是图片文件', true);
});

/* 拖到页面其他地方也能收（兜底） */
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter((f) => f.type.startsWith('image/'));
  if (files.length) upload(files);
});

/* 参考图：拖进来先占位（本地预览 + 进度条），再压缩上传，进度实时轮询服务端 */
const uploadCache = new Map();          // 同一张图重复拖入直接复用，不再上传
const kb = (n) => (n / 1048576 >= 1 ? (n / 1048576).toFixed(1) + 'MB' : Math.round(n / 1024) + 'KB');

const refUrls = () => items.filter((i) => i.status === 'done' && i.url).map((i) => i.url);

async function compressImage(file, maxSide = 2048, quality = 0.9) {
  if (!file.type.startsWith('image/') || file.size < 300 * 1024) return { file, note: '' };
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    if (scale === 1 && file.size < 1024 * 1024) return { file, note: '' };
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * scale);
    canvas.height = Math.round(bmp.height * scale);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    const type = file.type === 'image/png' ? 'image/webp' : 'image/jpeg';   // PNG→WebP 保留透明通道
    const blob = await new Promise((r) => canvas.toBlob(r, type, quality));
    if (!blob || blob.size >= file.size) return { file, note: '' };
    const name = file.name.replace(/\.[^.]+$/, '') + (type === 'image/webp' ? '.webp' : '.jpg');
    return { file: new File([blob], name, { type }), note: `压缩 ${kb(file.size)}→${kb(blob.size)}` };
  } catch (e) { return { file, note: '' }; }
}

async function sha256Hex(file) {
  try {
    const buf = await file.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);   // 127.0.0.1 属安全上下文，可用
    return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return ''; }
}

async function upload(files) {
  for (const raw of files) {
    const maxRefs = currentModel().references || 9;
    if (items.length >= maxRefs) { setStatus(`参考图最多 ${maxRefs} 张`, true); break; }

    // 1) 立刻占位：用得是本地预览，不等上传
    const item = {
      id: `u${Date.now()}${Math.floor(Math.random() * 1e4)}`,
      name: raw.name,
      preview: URL.createObjectURL(raw),
      status: 'uploading', percent: 0, phase: 'compress', url: '', note: '', error: '',
    };
    items.push(item);
    renderRefs();
    setStatus(`${raw.name} 处理中…`);

    const key = `${raw.name}|${raw.size}|${raw.lastModified}`;
    if (uploadCache.has(key)) {                       // 同一张图直接复用
      item.status = 'done'; item.url = uploadCache.get(key); item.percent = 100; item.phase = 'done';
      renderRefs(); setStatus('已添加参考图（复用上次上传）');
      continue;
    }

    // 2) 本地压缩
    const { file, note } = await compressImage(raw);
    item.note = note;
    item.phase = 'uploading';
    renderRefs();

    // 3) 上传 + 轮询真实进度
    const t0 = Date.now();
    const poll = setInterval(async () => {
      try {
        const p = await (await fetch('/api/upload-progress?id=' + encodeURIComponent(item.id))).json();
        if (p.phase && p.phase !== 'unknown') {
          item.phase = p.phase; item.percent = p.percent ?? item.percent;
          renderRefs();
          if (item.status === 'uploading') {
            const secs = ((Date.now() - t0) / 1000).toFixed(0);
            setStatus(p.phase === 'compress' ? `${item.name} 压缩中…`
              : p.phase === 'connecting' ? `${item.name} 正在连接平台… ${secs}s`
              : p.phase === 'waiting' ? `${item.name} 已发完，等待平台响应… ${secs}s`
              : `${item.name} 上传中 ${item.percent}% · ${secs}s`);
          }
        }
      } catch (e) { /* 轮询失败不影响上传 */ }
    }, 350);
    try {
      const digest = await sha256Hex(file);
      const fd = new FormData();
      fd.append('file', file);
      const data = await (await fetch('/api/upload', {
        method: 'POST',
        headers: Object.assign(digest ? { 'X-Content-SHA256': digest } : {}, { 'X-Upload-Id': item.id }),
        body: fd,
      })).json();
      if (data.error) throw new Error(data.error);
      uploadCache.set(key, data.url);
      item.status = 'done'; item.url = data.url; item.percent = 100; item.phase = 'done'; item.cached = data.cached;
      setStatus(`已添加参考图（${data.cached ? '平台已有此图，未重复上传' : '新上传'}）· 用时 ${((Date.now() - t0) / 1000).toFixed(1)}s`);
    } catch (err) {
      item.status = 'error'; item.error = err.message;
      setStatus('上传失败：' + err.message, true);
    } finally {
      clearInterval(poll);
      renderRefs();
    }
  }
}

function renderRefs() {
  const box = $('refs');
  box.querySelectorAll('.thumb').forEach((n) => n.remove());
  items.forEach((item) => {
    const d = document.createElement('div');
    d.className = 'thumb' + (item.status === 'uploading' ? ' pending' : '') + (item.status === 'error' ? ' err' : '');
    const img = item.status === 'done' && item.url
      ? `/api/image?u=${encodeURIComponent(item.url)}`
      : item.preview;
    let overlay = '';
    if (item.status === 'uploading') {
      const pct = item.phase === 'compress' ? 0 : item.percent;
      const txt = item.phase === 'compress' ? '压缩中' : item.phase === 'connecting' ? '连接中'
        : item.phase === 'waiting' ? '等待平台' : `${pct}%`;
      overlay = `<div class="pct">${txt}</div><div class="prog"><i style="width:${item.phase === 'waiting' ? 100 : pct}%"></i></div>`;
    } else if (item.status === 'error') {
      overlay = `<div class="pct">失败</div>`;
    }
    d.innerHTML = `<img src="${img}" alt="" />${overlay}<span class="x">✕</span>`;
    d.title = item.status === 'error' ? item.error : (item.note ? `${item.name}（${item.note}）` : item.name);
    d.querySelector('.x').onclick = () => {
      if (item.preview) URL.revokeObjectURL(item.preview);
      items = items.filter((i) => i !== item);
      renderRefs();
    };
    box.appendChild(d);
  });
  $('drop').style.display = items.length >= (currentModel().references || 9) ? 'none' : 'flex';
}

/* ── 图片全屏预览：左右切换、滚轮缩放、左键拖拽、序号、模型与提示词 ── */
let lbList = [], lbIndex = 0;
let lbZoom = 1, lbTx = 0, lbTy = 0, lbDrag = null, lbMoved = false;

function lbCollect() {
  return allRecords.filter((r) => (r.images || [])[0]).map((r) => ({
    key: r.id || r.task_id,
    src: imgSrc(r.images[0]),
    model: r.model || '',
    prompt: r.prompt || '',
  }));
}

function lbApplyZoom() {
  const img = $('lbImg');
  img.style.transform = `translate(${lbTx}px, ${lbTy}px) scale(${lbZoom})`;
  img.classList.toggle('zoomed', lbZoom > 1.01);
}

function lbResetZoom() {
  lbZoom = 1; lbTx = 0; lbTy = 0;
  $('lbImg').classList.remove('zoomed', 'dragging');
  lbApplyZoom();
}

function lbShow(i) {
  if (!lbList.length) return;
  lbIndex = (i + lbList.length) % lbList.length;
  const it = lbList[lbIndex];
  lbResetZoom();
  $('lbImg').src = it.src;
  $('lbCount').textContent = `${lbIndex + 1} / ${lbList.length}`;
  $('lbModel').textContent = it.model;
  $('lbPrompt').textContent = it.prompt;
  const single = lbList.length <= 1;
  $('lbPrev').disabled = single;
  $('lbNext').disabled = single;
}

function lbOpen(rec) {
  lbList = lbCollect();
  const key = rec.id || rec.task_id;
  lbIndex = Math.max(0, lbList.findIndex((x) => x.key === key));
  if (!lbList.length) return;
  $('lightbox').hidden = false;
  document.body.style.overflow = 'hidden';
  lbShow(lbIndex);
}

function lbClose() {
  $('lightbox').hidden = true;
  $('lbImg').src = '';
  lbResetZoom();
  document.body.style.overflow = '';
}

$('lbClose').onclick = lbClose;
$('lbPrev').onclick = (e) => { e.stopPropagation(); lbShow(lbIndex - 1); };
$('lbNext').onclick = (e) => { e.stopPropagation(); lbShow(lbIndex + 1); };
$('lightbox').onclick = (e) => { if (e.target === $('lightbox') && !lbMoved) lbClose(); };   // 点空白处关闭（拖拽后不误关）

/* 复制提示词：按下变「已复制」，2 秒后还原 */
$('lbCopy').onclick = async (e) => {
  e.stopPropagation();
  const btn = $('lbCopy');
  const ok = await copyText(lbList[lbIndex]?.prompt || '', null);
  if (!ok) return;
  btn.textContent = '已复制';
  clearTimeout(btn._timer);
  btn._timer = setTimeout(() => { btn.textContent = '复制提示词'; }, 2000);
};

/* 查看文件：在访达里选中该图（复用记录卡片那套逻辑） */
$('lbReveal').onclick = (e) => {
  e.stopPropagation();
  const key = lbList[lbIndex]?.key;
  if (key) reveal(key, $('lbReveal'));
};

/* 滚轮 = 缩放（不再切图），左键按住 = 拖动 */
$('lbImg').addEventListener('wheel', (e) => {
  e.preventDefault(); e.stopPropagation();
  lbZoom = Math.min(8, Math.max(1, lbZoom * Math.exp(-e.deltaY * 0.0015)));
  if (lbZoom <= 1.01) { lbTx = 0; lbTy = 0; }
  lbApplyZoom();
}, { passive: false });

$('lbImg').addEventListener('mousedown', (e) => {
  if (lbZoom <= 1.01) return;          // 没放大时不拖，避免误触
  e.preventDefault();
  lbMoved = false;
  lbDrag = { x: e.clientX, y: e.clientY, tx: lbTx, ty: lbTy };
  $('lbImg').classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!lbDrag) return;
  const dx = e.clientX - lbDrag.x, dy = e.clientY - lbDrag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) lbMoved = true;
  lbTx = lbDrag.tx + dx;
  lbTy = lbDrag.ty + dy;
  lbApplyZoom();
});
window.addEventListener('mouseup', () => {
  if (!lbDrag) return;
  lbDrag = null;
  $('lbImg').classList.remove('dragging');
});

document.addEventListener('keydown', (e) => {
  if ($('lightbox').hidden) return;
  if (e.key === 'Escape') lbClose();
  else if (e.key === 'ArrowLeft') lbShow(lbIndex - 1);
  else if (e.key === 'ArrowRight') lbShow(lbIndex + 1);
});

function setStatus(text, err = false) { $('status').textContent = text; $('status').classList.toggle('err', !!err); }

/* 生成：表单里填了什么就发什么 */
$('go').onclick = async () => {
  if (busy) return;
  const prompt = $('prompt').value.trim();
  if (!prompt) { setStatus('提示词不能为空', true); $('prompt').focus(); return; }
  busy = true;
  syncButton();
  $('go').innerHTML = '<span class="spinner"></span><span>生成中…</span>';
  $('bar').hidden = false;
  $('bar').firstElementChild.style.width = '8%';

  const body = {
    model: currentModel().id,          // 分段控制器选的模型
    prompt,
    size: $('size').value,
    resolution: $('resolution').value,
    n: +$('n').value,
    images: refUrls(),
  };
  try {
    const r = await (await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
    if (r.error) throw new Error(r.error);
    setStatus('已提交，生成中…');
    poll(r.task_id, body);
  } catch (err) { fail(err.message); }
};

/* 轮询用「跑完再排下一次」，不用 setInterval：平台慢时单次查询可能十几秒，
   setInterval 会叠出一堆并发请求，反而拖慢 */
function poll(id, body) {
  const started = Date.now();
  const tick = async () => {
    if (poller === null) return;
    try {
      const t = await (await fetch('/api/task?id=' + encodeURIComponent(id))).json();
      if (poller === null) return;
      if (t.error) throw new Error(t.error);
      const secs = ((Date.now() - started) / 1000).toFixed(0);
      $('bar').firstElementChild.style.width = Math.max(8, Math.min(95, t.progress || 0)) + '%';
      setStatus(`生成中… ${t.display_status || t.status}${t.progress != null ? ' ' + t.progress + '%' : ''}（${secs}s）`);
      if (t.status === 'completed') {
        poller = null;
        $('bar').firstElementChild.style.width = '100%';
        page = 1;                       // 新记录在最前，回到第一页
        await loadHistory();
        done(`完成 · ${(t.result_urls || []).length} 张 · $${t.cost ?? ''}`);
        return;
      }
      if (['failed', 'violation', 'error'].includes(t.status)) {
        poller = null;
        fail(t.error_msg || `任务 ${t.status}`);
        return;
      }
      poller = setTimeout(tick, 3000);
    } catch (err) {
      poller = null;
      fail(err.message);
    }
  };
  poller = setTimeout(tick, 1500);
}

/* ── 生成记录：服务端持久化 + 每页 10 条分页 ── */
let allRecords = [], page = 1;
const PER_PAGE = 10;

function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function imgSrc(im) {
  return im.file ? `/api/image?f=${encodeURIComponent(im.file)}` : `/api/image?u=${encodeURIComponent(im.url)}`;
}

async function loadHistory() {
  try {
    const h = await (await fetch('/api/history')).json();
    renderRecords(h.records || []);
  } catch (e) { /* 网络抖动就保持现状 */ }
}

function renderRecords(records) {
  allRecords = records;
  const pages = Math.max(1, Math.ceil(records.length / PER_PAGE));
  if (page > pages) page = pages;
  if (page < 1) page = 1;
  const start = (page - 1) * PER_PAGE;

  const box = $('results');
  box.innerHTML = '';
  box.hidden = records.length === 0;          // 没记录时让空状态在固定高度里居中
  $('empty').hidden = records.length > 0;
  $('count').textContent = records.length ? `${records.length} 条` : '';
  records.slice(start, start + PER_PAGE).forEach((r) => box.appendChild(card(r)));
  renderPager(pages, records.length);
  box.scrollTop = 0;
  scheduleHistoryRefresh(records);
}

/* 只要有记录还在「生成中」，就每 5 秒问一次服务端（服务端会去平台对账） */
let historyTimer = null;
function scheduleHistoryRefresh(records) {
  if (historyTimer) { clearTimeout(historyTimer); historyTimer = null; }
  if (records.some((r) => r.status === 'pending')) historyTimer = setTimeout(loadHistory, 4000);
}

function renderPager(pages, total) {
  const el = $('pager');
  el.innerHTML = '';
  const mk = (label, target, opts = {}) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (opts.active) b.className = 'active';
    if (opts.disabled) b.disabled = true;
    b.onclick = () => { page = target; renderRecords(allRecords); };
    return b;
  };
  el.appendChild(mk('上一页', page - 1, { disabled: page <= 1 }));
  const nums = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  nums.forEach((n) => {
    if (n === '…') {
      const s = document.createElement('span');
      s.className = 'dots';
      s.textContent = '…';
      el.appendChild(s);
    } else el.appendChild(mk(String(n), n, { active: n === page }));
  });
  el.appendChild(mk('下一页', page + 1, { disabled: page >= pages }));
  const info = document.createElement('span');
  info.className = 'info';
  info.textContent = `第 ${page}/${pages} 页 · 共 ${total} 条`;
  el.appendChild(info);
}

const ICON_COPY = '<svg viewBox="1.8 1.8 12.4 12.4" fill="none" stroke="currentColor" stroke-width="1"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"/><path d="M10.5 5.5V4.1A1.6 1.6 0 0 0 8.9 2.5H4.1A1.6 1.6 0 0 0 2.5 4.1v4.8a1.6 1.6 0 0 0 1.6 1.6h1.4"/></svg>';
const ICON_DONE = '<svg viewBox="2 4 12 9" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 8.5l3.2 3.2L13 5"/></svg>';

/** 复制文本：优先剪贴板 API，失败退回 execCommand */
async function copyText(text, el) {
  if (!text) { setStatus('这条没有提示词可复制', true); return false; }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    if (el) {
      el.classList.add('done'); el.innerHTML = ICON_DONE;
      setTimeout(() => { el.classList.remove('done'); el.innerHTML = ICON_COPY; }, 1200);
    }
    setStatus('提示词已复制到剪贴板');
    return true;
  } catch (err) {
    setStatus('复制失败：' + err.message, true);
    return false;
  }
}

function card(r) {
  const el = document.createElement('div');
  el.className = 'card';
  const first = (r.images || [])[0];
  const bad = ['failed', 'violation', 'error'].includes(r.status);
  const pct = Number.isFinite(r.progress) ? r.progress : null;
  const stateCn = { submitted: '排队中', pending: '排队中', processing: '生成中', completed: '完成', failed: '生成失败', violation: '未通过' }[r.display_status] || '生成中';
  const placeholder = bad
    ? `<div class="ph bad">生成失败${r.error ? '<br />' + escapeHtml(String(r.error).slice(0, 80)) : ''}</div>`
    : `<div class="ph"><div>${stateCn}…</div><div class="pbar${pct === null ? ' indet' : ''}"><i${pct === null ? '' : ` style="width:${pct}%"`}></i></div>${pct === null ? '' : `<div class="ppct">${pct}%</div>`}</div>`;
  const shot = first
    ? `<img src="${imgSrc(first)}" alt="" loading="lazy" />`
    : placeholder;
  const params = [fmtTime(r.created_at), r.size, r.resolution, r.cost != null ? '$' + Number(r.cost).toFixed(4) : '']
    .filter(Boolean).join(' · ');
  const idx = r.total > 1 ? `<span class="idx">${r.index}/${r.total}</span>` : '';
  const id = escapeHtml(r.id || r.task_id || '');
  el.innerHTML = `
    <div class="shot">${shot}</div>
    <div class="body">
      <div class="cap" title="${escapeHtml(r.prompt || '')}">${escapeHtml(r.prompt || '')}<span class="copy" title="复制提示词">${ICON_COPY}</span></div>
      <div class="meta">
        <span class="left">${params}</span>
        <span class="right">${idx}<a data-id="${id}">查看文件</a></span>
      </div>
    </div>`;
  const link = el.querySelector('a[data-id]');
  if (link) link.onclick = () => reveal(link.dataset.id, link);
  const pic = el.querySelector('.shot img');
  if (pic) pic.onclick = () => lbOpen(r);
  const copy = el.querySelector('.copy');
  if (copy) copy.onclick = (e) => { e.stopPropagation(); copyText(r.prompt || '', copy); };
  return el;
}

/* 打开图片所在文件夹（Finder 里选中该文件） */
async function reveal(id, link) {
  const old = link.textContent;
  link.textContent = '打开中…';
  try {
    const r = await (await fetch('/api/reveal', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }),
    })).json();
    if (r.error) throw new Error(r.error);
    setStatus('已在文件夹中打开');
  } catch (err) { setStatus('打开失败：' + err.message, true); }
  link.textContent = old;
}

function done(text) {
  busy = false; $('bar').hidden = true;
  $('bar').firstElementChild.style.width = '0';
  $('go').innerHTML = '<span id="go-text"></span>';
  price(); setStatus(text); loadHistory();
}
function fail(msg) {
  busy = false; $('bar').hidden = true;
  $('bar').firstElementChild.style.width = '0';
  $('go').innerHTML = '<span id="go-text"></span>';
  price(); setStatus('失败：' + msg, true); loadHistory();
}

loadHistory();

/* ── 授权闸门：首次填 Key / 每次启动校验（仅桌面版：/api/state 带 auth 时生效）── */
let authTimer = null;

const gateRender = (html) => { $('gateBody').innerHTML = html; };
const clearAuthPoll = () => { if (authTimer) { clearTimeout(authTimer); authTimer = null; } };
const hideGate = () => { $('gate').hidden = true; };

function gateChecking() {
  $('gate').hidden = false;
  gateRender(`<div class="gate-center"><div class="gate-spin"></div><div class="gate-sub">正在校验 API 密钥…</div></div>`);
}

function gateForm(msg, warn) {
  $('gate').hidden = false;
  gateRender(`
    <p class="gate-sub">填入麦子 AI 的 API 密钥，验证通过后即可开始生图。密钥只保存在本机。</p>
    <label class="gate-label" for="gateKey">API 密钥</label>
    <input class="gate-input" id="gateKey" type="text" placeholder="sk-..." spellcheck="false" autocomplete="off" />
    ${msg ? `<div class="gate-err">${msg}</div>` : ''}
    ${warn ? `<div class="gate-warn">${warn}</div>` : ''}
    <button class="gate-btn" id="gateSave">保存并验证</button>
    ${warn ? '<button class="gate-btn ghost" id="gateSkip">先用上次配置进入</button>' : ''}
    <div class="gate-hint">还没有密钥？到 <a href="https://www.maizitech.xyz" target="_blank" rel="noreferrer">maizitech.xyz</a> 注册后创建</div>`);
  const input = $('gateKey');
  input.focus();
  input.onkeydown = (e) => { if (e.key === 'Enter') $('gateSave').click(); };
  $('gateSave').onclick = async () => {
    const key = input.value.trim();
    if (!key) { input.focus(); return; }
    const btn = $('gateSave');
    btn.disabled = true; btn.textContent = '校验中…';
    clearAuthPoll();
    try {
      const r = await (await fetch('/api/settings', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ apiKey: key }),
      })).json();
      if (r.ok !== true) { gateForm(r.error || '密钥无效，请检查后重试'); return; }
      if (r.status === 'ok') {
        gateRender('<div class="gate-center"><div class="gate-spin"></div><div class="gate-sub">校验通过，正在进入…</div></div>');
        setTimeout(() => location.reload(), 400);
      } else {
        gateForm('', r.error || '平台暂时无法连接');   // 已保存，但当前连不上
      }
    } catch (err) { gateForm('保存失败：' + err.message); }
  };
  if ($('gateSkip')) $('gateSkip').onclick = () => { clearAuthPoll(); hideGate(); };
}

async function pollAuth() {
  authTimer = null;
  try {
    const s = await (await fetch('/api/state')).json();
    const a = s && s.auth;
    applyAuth(s);
    if (a && a.status === 'checking') authTimer = setTimeout(pollAuth, 1800);
  } catch (e) {
    authTimer = setTimeout(pollAuth, 2500);      // 接口抖动：继续试
  }
}

/** 处理授权状态，返回 true 表示已放行进入界面 */
function applyAuth(s) {
  const auth = s && s.auth;
  if (!auth) { $('btnKey').hidden = true; $('btnQuit').hidden = true; hideGate(); return true; }   // 非桌面版
  $('btnKey').hidden = false;
  $('btnQuit').hidden = false;
  if (s.models && s.models.length) {
    state = s; models = s.models;
    currentId = models.some((m) => m.id === s.default) ? s.default : models[0].id;
    syncModel(true);
  }
  if (auth.status === 'ok') { clearAuthPoll(); hideGate(); return true; }
  if (auth.status === 'checking') {
    if (auth.trusted) { hideGate(); return false; }   // 以前校验通过过：先进界面，后台继续校验
    gateChecking(); return false;
  }
  if (auth.status === 'invalid') {
    clearAuthPoll();
    // 首次使用（还没配过密钥）不算错误，不弹红条
    gateForm(auth.has_key ? (auth.error || 'API 密钥无效，请重新配置') : '');
    return false;
  }
  gateForm('', auth.error || '平台暂时无法连接');    // unreachable：给一个"仍可进入"的口子
  return false;
}

$('btnKey').onclick = () => gateForm('');
$('btnQuit').onclick = async () => { try { await fetch('/api/quit', { method: 'POST' }); } catch (e) {} window.close(); };

</script>
